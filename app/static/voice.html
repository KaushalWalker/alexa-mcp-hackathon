
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayPilot Voice Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.5;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0000000d;
    }
    textarea, input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font: inherit;
      border-radius: 8px;
    }
    textarea, input { border: 1px solid #ccd2df; }
    button {
      border: 0;
      background: #2457d6;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .secondary { background: #475569; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f1f4f9;
      padding: 12px;
      border-radius: 8px;
    }
    #status { color: #475569; }
  </style>
</head>
<body>
<main>
  <h1>🎙️ DayPilot</h1>
  <p>Your voice-first daily planning assistant.</p>

  <label for="planDate">Planning date</label>
  <input id="planDate" type="date">

  <label for="message">Your request</label>
  <textarea id="message" rows="3"
    placeholder="For example: Help me organize my day"></textarea>

  <button id="listenButton" type="button">🎤 Start listening</button>
  <button id="sendButton" type="button">Send to DayPilot</button>
  <button id="speakButton" type="button" class="secondary">
    🔊 Read response again
  </button>

  <p id="status" role="status">Ready.</p>

  <h2>Assistant response</h2>
  <pre id="response">Your response will appear here.</pre>

  <h2>Generated plan</h2>
  <pre id="plan">Your plan will appear here.</pre>
</main>

<script>
  const messageInput = document.getElementById("message");
  const dateInput = document.getElementById("planDate");
  const statusText = document.getElementById("status");
  const responseBox = document.getElementById("response");
  const planBox = document.getElementById("plan");
  const listenButton = document.getElementById("listenButton");
  const sendButton = document.getElementById("sendButton");
  const speakButton = document.getElementById("speakButton");

  dateInput.value = new Date().toLocaleDateString("en-CA");

  let lastSpokenResponse = "";

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    listenButton.disabled = true;
    statusText.textContent =
      "Speech recognition is not supported here. Try a recent version of Chrome or Edge.";
  }

  listenButton.addEventListener("click", () => {
    if (!SpeechRecognition) return;

    const recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      statusText.textContent = "Listening... Speak now.";
      listenButton.disabled = true;
    };

    recognition.onresult = (event) => {
      messageInput.value = event.results[0][0].transcript;
      statusText.textContent =
        "Speech captured. Press Send to submit your request.";
    };

    recognition.onerror = (event) => {
      statusText.textContent = "Microphone error: " + event.error;
    };

    recognition.onend = () => {
      listenButton.disabled = false;
    };

    recognition.start();
  });

  async function sendRequest() {
    const message = messageInput.value.trim();

    if (!message) {
      statusText.textContent = "Please type or speak a request first.";
      return;
    }

    sendButton.disabled = true;
    statusText.textContent = "DayPilot is preparing your plan...";

    try {
      const result = await fetch("/assistant", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message,
          plan_date: dateInput.value
        })
      });

      const data = await result.json();

      if (!result.ok) {
        throw new Error(data.detail || "Request failed.");
      }

      responseBox.textContent = data.assistant_response;
      planBox.textContent = JSON.stringify(data.plan, null, 2);

      lastSpokenResponse =
        `I've generated your plan for ${data.plan.plan_date}. ` +
        "The detailed plan is displayed on your screen.";

      statusText.textContent =
        `Plan generated successfully. Provider: ${data.provider}.`;

      speak(lastSpokenResponse);
    } catch (error) {
      statusText.textContent = "Error: " + error.message;
    } finally {
      sendButton.disabled = false;
    }
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) {
      statusText.textContent += " Speech output is unavailable in this browser.";
      return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-IN";
    window.speechSynthesis.speak(utterance);
  }

  sendButton.addEventListener("click", sendRequest);

  speakButton.addEventListener("click", () => {
    if (lastSpokenResponse) {
      speak(lastSpokenResponse);
    } else {
      statusText.textContent = "Generate a plan first.";
    }
  });
</script>
</body>
</html>
